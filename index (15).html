<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>NOUVELLE DIMENSION</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f3f5f9;--sf:#fff;--ink:#14213d;--mut:#5b6478;--ac:#0b7a75;--acs:#d9efed;--bad:#b3261e;--ln:#d5dae4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1524;--sf:#18203a;--ink:#e9edf7;--mut:#9aa5bf;--ac:#35c2b9;--acs:#17403f;--bad:#ff8a80;--ln:#2b3555}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif;max-width:900px;margin:auto}
h1,h2,h3,button,input,select,label,th{font-family:system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--ink);color:var(--bg)}
header b{font-size:17px}header small{opacity:.8}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--ln)}
nav button{white-space:nowrap}
main{padding:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:12px}
button{border:1px solid var(--ln);background:var(--sf);color:var(--ink);padding:9px 13px;border-radius:8px;font-size:15px;cursor:pointer}
button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
button.del{color:var(--bad)}
input,select{width:100%;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);color:var(--ink);font-size:16px;margin:4px 0 10px}
label{font-size:14px;color:var(--mut)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}.mut{color:var(--mut);font-size:14px}
.st{display:flex;gap:4px}.st button{padding:7px 11px}
table{width:100%;border-collapse:collapse}td,th{border:1px solid var(--ln);padding:7px;text-align:left;font-size:15px}
.ok{color:var(--ac);font-weight:700}.ko{color:var(--bad);font-weight:700}
.stat{display:flex;gap:10px;flex-wrap:wrap}.stat div{flex:1;min-width:110px;background:var(--acs);border-radius:10px;padding:10px}.stat b{font-size:24px;display:block}
.sig{display:flex;justify-content:space-between;margin-top:90px;text-align:center;gap:10px}.sig div{flex:1;border-top:1px solid var(--ink);padding-top:6px;font-size:14px}
@media print{header,nav,.np{display:none}body{background:#fff;color:#000}.card{border:0}}
</style></head><body>

function vImp(){if(role()==="parent")return"";const t=role()==="enseignant",ci=t?U.classe:(SEL.ic||"Maternelle"),cd=t?U.classe:(SEL.dc||"Maternelle"),pk=(cur,k)=>`<label>Classe</label><select onchange="SEL.${k}=this.value;draw()">${C.map(c=>`<option ${c===cur?"selected":""}>${c}</option>`).join("")}</select>`;
 return`<div class="card"><h3>Importer une liste de classe (PDF ou feuille de calcul)</h3>${t?`<p class="mut">Classe : ${e(ci)}</p>`:pk(ci,"ic")}<label>Fichier : PDF, Excel ou CSV</label><input type="file" accept=".pdf,.csv,.xlsx,.xls,.ods,application/pdf" onchange="readPdf(this)">${err()}${SEL.done?`<p class="ok">${e(SEL.done)}</p>`:""}${SEL.imp&&SEL.imp.length?`<h3>Vérifiez la liste (${SEL.imp.length} lignes lues)</h3><p class="mut">Corrigez le nom, les prénoms et le sexe, décochez les lignes à ignorer.</p>${SEL.imp.map((r,i)=>`<div class="row" style="gap:6px"><input type="checkbox" style="width:auto;margin:0" ${r.ok?"checked":""} onchange="SEL.imp[${i}].ok=this.checked"><input style="margin:0" value="${e(r.nom)}" onchange="SEL.imp[${i}].nom=this.value"><input style="margin:0" value="${e(r.pre)}" onchange="SEL.imp[${i}].pre=this.value"><select style="width:64px;margin:0" onchange="SEL.imp[${i}].sx=this.value"><option ${r.sx==="M"?"selected":""}>M</option><option ${r.sx==="F"?"selected":""}>F</option></select></div><div class="mut" style="margin:-6px 0 8px 26px">${e([r.mat,r.dn,r.lieu,r.par,r.tel].filter(Boolean).join(" · "))}</div>`).join("")}<button class="pri" onclick="confirmImp()">Importer dans ${e(ci)}</button>`:""}</div>
 <div class="card"><h3>Télécharger la liste d’une classe</h3>${t?`<p class="mut">Classe : ${e(cd)}</p>`:pk(cd,"dc")}<button class="pri" onclick="dlList()">Télécharger en PDF</button></div>`}
const TABS=[["acc","Accueil","acc"],["tab","Tableau","direction"],["eleves","Élèves","eleves"],["pres","Présences","pres"],["notes","Notes","notes"],["bull","Bulletins","bull"],["pers","Personnel","direction"],["fin","Finances","direction"],["pay","Paiements","pay"],["msg","Messages","msg"],["cpt","Comptes","direction"],["cal","Calendrier","cal"],["disc","Discipline","disc"],["rem","Remédiation","rem"],["rap","Rapports","direction"],["ann","Années","direction"],["sav","Sauvegarde","direction"],["par","Paramètres","direction"]];

function loginView(){const first=!S.users.length,m=first?"new":(SEL.lm||"in");
 const st=`<style>.lg{background:#fbf8f3;color:#6b3f24;min-height:100vh;padding:18px 22px 30px;font-family:system-ui,-apple-system,sans-serif}.lg a{color:#a9602f;cursor:pointer}.lg .bk{color:#9a9488;font-weight:700;letter-spacing:.06em;cursor:pointer;background:none;border:0;padding:0}.lg h1{font:700 32px Georgia,serif;text-align:center;margin:14px 0 8px;color:#6b3f24}.lg .sub{text-align:center;color:#7a746c;margin:0 0 20px}.lg .ic{width:76px;height:76px;border-radius:22px;background:#6b3f24;margin:10px auto 0;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(107,63,36,.25)}.lg .tb{display:flex;background:#f5f3ee;border:1px solid #e8e4dc;border-radius:18px;padding:5px;margin-bottom:16px}.lg .tb button{flex:1;border:0;background:none;color:#7a746c;font-weight:700;border-radius:14px;padding:12px}.lg .tb button.on{background:#fff;color:#6b3f24;box-shadow:0 2px 5px rgba(0,0,0,.12)}.lg .gg{width:100%;border:1px solid #e3ded4;background:#fff;border-radius:18px;padding:15px;font-weight:700;color:#999;margin-bottom:6px}.lg .or{display:flex;align-items:center;gap:12px;color:#a09a8f;font-weight:700;font-size:13px;letter-spacing:.1em;margin:16px 0}.lg .or:before,.lg .or:after{content:"";flex:1;height:1px;background:#e8e4dc}.lg input{background:#faf9f7;border:1px solid #eeeae2;border-radius:18px;padding:17px 16px;color:#4a2d1b;margin:0 0 14px}.lg .pw{position:relative}.lg .pw span{position:absolute;right:16px;top:15px;cursor:pointer;color:#b5aea2}.lg .go{width:100%;background:#874d2d;color:#fff;border:0;border-radius:22px;padding:20px;font-weight:800;letter-spacing:.12em;margin-top:8px}.lg .mt{color:#7a746c;font-size:14px}</style>`;
 const form=m==="new"&&!first?`<p class="mt" style="text-align:center">Les comptes des enseignants, de la secrétaire et des parents sont créés par la Direction de l’école.</p>`:`<button class="gg" disabled>Continuer avec Google</button><p class="mt" style="text-align:center;margin:4px 0">Bientôt disponible, avec l’hébergement.</p><div class="or">OU PAR EMAIL</div><input id="u" type="text" autocapitalize="off" autocomplete="username" placeholder="Email ou identifiant"><div class="pw"><input id="p" type="password" autocomplete="current-password" placeholder="Mot de passe" onkeydown="if(event.key==='Enter')${m==="new"?"setup":"login"}()"><span onclick="const i=document.getElementById('p');i.type=i.type==='password'?'text':'password'">👁</span></div>${m==="new"?`<p class="mt">Première ouverture : ce compte sera celui de la Direction.</p>`:`<div style="text-align:right"><a onclick="SEL.lf=!SEL.lf;draw()">Mot de passe oublié ?</a></div>`}${err()}<button class="go" onclick="${m==="new"?"setup":"login"}()">${m==="new"?"CRÉER LE COMPTE":"SE CONNECTER"}</button>`;
 const fg=SEL.lf&&m==="in"?`<div class="mt" style="margin-top:18px;padding:14px;border:1px solid #e8e4dc;border-radius:14px">Pas d’envoi d’email pour l’instant. Les enseignants, la secrétaire et les parents demandent à la Direction de changer leur mot de passe (onglet Comptes). Si c’est le compte de la Direction : vous pouvez effacer toutes les données de cet appareil et repartir de zéro.<br><br>${SEL.wc?`<b style="color:#b3261e">Tout sera effacé définitivement.</b><br><button class="go" style="background:#b3261e" onclick="wipe()">CONFIRMER L’EFFACEMENT</button>`:`<a onclick="SEL.wc=1;draw()">Effacer les données de cet appareil</a>`}</div>`:"";
 return st+`<div class="lg"><button class="bk" onclick="SEL.lf=0;SEL.wc=0;SEL.lm='in';ERR='';draw()">← ACCUEIL</button><div class="ic"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#d9a441" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h11M10 7l5 5-5 5M17 4h2a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-2"/></svg></div><h1>${first||m==="new"?"CRÉER UN COMPTE":"CONNEXION"}</h1><p class="sub">Entrez dans votre espace NOUVELLE DIMENSION pour poursuivre.</p>${first?"":`<div class="tb"><button class="${m==="in"?"on":""}" onclick="SEL.lm='in';ERR='';draw()">Se connecter</button><button class="${m==="new"?"on":""}" onclick="SEL.lm='new';ERR='';draw()">Créer un compte</button></div>`}${form}${fg}</div>`}
function draw(){const A=document.getElementById("app");if(!U){A.innerHTML=loginView();return}
 if(!S.users.length){A.innerHTML=`<main><div class="card"><h2>NOUVELLE DIMENSION</h2><p>Première ouverture : créez le compte de la Direction.</p><label>Identifiant</label><input id="u" autocapitalize="off"><label>Mot de passe</label><input id="p" type="password"><button class="pri" onclick="setup()">Créer le compte</button>${err()}</div></main>`;return}
 if(!U){A.innerHTML=`<main><div class="card"><h2>NOUVELLE DIMENSION</h2><p class="mut">CSP · Année scolaire ${AN}</p><label>Identifiant</label><input id="u" autocapitalize="off"><label>Mot de passe</label><input id="p" type="password" onkeydown="if(event.key==='Enter')login()"><button class="pri" onclick="login()">Se connecter</button>${err()}</div></main>`;return}
 const tabs=TABS.filter(t=>t[2]==="direction"?role()==="direction":can(t[2]));

 A.innerHTML=`<header><div><b>NOUVELLE DIMENSION</b><br><small>${e(U.login)} · ${ROLES[U.role]}</small></div><button onclick="out()">Quitter</button></header><nav>${tabs.map(t=>`<button class="${t[0]===T?"on":""}" onclick="go('${t[0]}')">${t[1]}</button>`).join("")}</nav><main>${V()}</main>`;savePos();afterDraw()}
