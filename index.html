<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>NOUVELLE DIMENSION</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f3f5f9;--sf:#fff;--ink:#14213d;--mut:#5b6478;--ac:#0b7a75;--acs:#d9efed;--bad:#b3261e;--ln:#d5dae4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1524;--sf:#18203a;--ink:#e9edf7;--mut:#9aa5bf;--ac:#35c2b9;--acs:#17403f;--bad:#ff8a80;--ln:#2b3555}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif;max-width:900px;margin:auto}
h1,h2,h3,button,input,select,label,th{font-family:system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--ink);color:var(--bg)}
header b{font-size:17px}header small{opacity:.8}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--ln)}
nav button{white-space:nowrap}
main{padding:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:12px}
button{border:1px solid var(--ln);background:var(--sf);color:var(--ink);padding:9px 13px;border-radius:8px;font-size:15px;cursor:pointer}
button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
button.del{color:var(--bad)}
input,select{width:100%;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);color:var(--ink);font-size:16px;margin:4px 0 10px}
label{font-size:14px;color:var(--mut)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}.mut{color:var(--mut);font-size:14px}
.st{display:flex;gap:4px}.st button{padding:7px 11px}
table{width:100%;border-collapse:collapse}td,th{border:1px solid var(--ln);padding:7px;text-align:left;font-size:15px}
.ok{color:var(--ac);font-weight:700}.ko{color:var(--bad);font-weight:700}
.stat{display:flex;gap:10px;flex-wrap:wrap}.stat div{flex:1;min-width:110px;background:var(--acs);border-radius:10px;padding:10px}.stat b{font-size:24px;display:block}
.sig{display:flex;justify-content:space-between;margin-top:90px;text-align:center;gap:10px}.sig div{flex:1;border-top:1px solid var(--ink);padding-top:6px;font-size:14px}
@media print{header,nav,.np{display:none}body{background:#fff;color:#000}.card{border:0}}
